<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PETRA CRM</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1F4FE0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2 29 9.5v13L16 30 3 22.5v-13z' fill='%231F4FE0'/%3E%3Cpath d='M11 22V10h6.2a4.3 4.3 0 0 1 0 8.6H11' fill='none' stroke='white' stroke-width='2.6' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" defer></script>
<style>
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: fixed left sidebar + fluid workspace; documents (slips, quotations) are fixed light A4 sheets */
:root{
  --bg:#F4F6F9; --panel:#FFFFFF; --panel2:#EEF1F6; --ink:#0D1424; --mu:#566173; --ln:#E1E6ED; --ln2:#CDD4DF;
  --ac:#1F4FE0; --aci:#FFFFFF; --acs:#E8EEFF; --ac2:#0E7C72;
  --ok:#0F7A55; --oks:#E2F4EB; --warn:#9A5800; --warns:#FFF1D9; --bad:#C2352B; --bads:#FDE8E6; --vio:#5B3FD1; --vios:#EEEAFE;
  --shadow:0 1px 2px rgba(13,20,36,.05),0 10px 28px -14px rgba(13,20,36,.18);
  --overlay:rgba(9,14,26,.45);
  --sans:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#080C14; --panel:#0F1522; --panel2:#161E2E; --ink:#E8EDF5; --mu:#9BA7B9; --ln:#212B3C; --ln2:#2E3A4F;
  --ac:#7C9DFF; --aci:#07112C; --acs:#172350; --ac2:#3CC4B4;
  --ok:#43CF95; --oks:#0F2A20; --warn:#F2B356; --warns:#2D2311; --bad:#FF8073; --bads:#311614; --vio:#B4A3FF; --vios:#221B45;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -14px rgba(0,0,0,.7); --overlay:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#080C14; --panel:#0F1522; --panel2:#161E2E; --ink:#E8EDF5; --mu:#9BA7B9; --ln:#212B3C; --ln2:#2E3A4F;
  --ac:#7C9DFF; --aci:#07112C; --acs:#172350; --ac2:#3CC4B4;
  --ok:#43CF95; --oks:#0F2A20; --warn:#F2B356; --warns:#2D2311; --bad:#FF8073; --bads:#311614; --vio:#B4A3FF; --vios:#221B45;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -14px rgba(0,0,0,.7); --overlay:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--ac)}
h1,h2,h3{text-wrap:balance;margin:0;letter-spacing:-.015em}
.mono{font-family:var(--mono)}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Shell */
.app{display:flex;min-height:100%}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;width:248px;flex:none;background:var(--panel);border-right:1px solid var(--ln);display:flex;flex-direction:column;padding:18px 14px;gap:6px;z-index:40}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;text-decoration:none;color:var(--ink)}
.brand b{font-size:16px;letter-spacing:.14em}
.brand small{display:block;font:500 11px var(--mono);color:var(--mu);letter-spacing:.02em}
.navgroup{font:500 11px var(--mono);color:var(--mu);text-transform:uppercase;letter-spacing:.08em;padding:14px 10px 6px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;color:var(--mu);text-decoration:none;font-weight:500;min-height:38px}
.nav a:hover{background:var(--panel2);color:var(--ink)}
.nav a.on{background:var(--acs);color:var(--ink)}
.nav a.on svg{color:var(--ac)}
.nav a .cnt{margin-left:auto;font:500 11px var(--mono);background:var(--ac);color:var(--aci);border-radius:999px;padding:1px 7px}
.side-foot{margin-top:auto;padding:12px 10px;border-top:1px solid var(--ln);display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:10px;background:var(--acs);color:var(--ac);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:12px;padding:12px 28px}
.top .crumb{font-weight:600;font-size:15px}
.top .crumb span{color:var(--mu);font-weight:500}
.top .sp{flex:1}
.demo{font:500 11px var(--mono);color:var(--warn);background:var(--warns);border-radius:999px;padding:4px 10px;letter-spacing:.04em}
.iconbtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--ln);background:var(--panel);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.iconbtn:hover{border-color:var(--ln2)}
.menu-btn{display:none}
.view{padding:28px;display:flex;flex-direction:column;gap:22px;max-width:1440px;width:100%}
.scrim{display:none}
@media (max-width:960px){
  .side{position:fixed;left:0;top:0;bottom:0;height:auto;transform:translateX(-102%);transition:transform .25s;box-shadow:var(--shadow)}
  .side.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:var(--overlay);z-index:35}
  .menu-btn{display:grid}
  .top{padding:10px 16px}
  .view{padding:18px 16px}
  .top .demo{display:none}
}

/* Headings */
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px}
.ph h1{font-size:26px;font-weight:650}
.ph p{margin:4px 0 0;color:var(--mu);max-width:640px}
.ph .acts{display:flex;flex-wrap:wrap;gap:8px}

/* Buttons & form */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 15px;border-radius:10px;border:1px solid var(--ln);background:var(--panel);color:var(--ink);font-weight:600;font-size:13.5px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--ln2);background:var(--panel2)}
.btn.p{background:var(--ac);border-color:var(--ac);color:var(--aci)}
.btn.p:hover{filter:brightness(1.08)}
.btn.sm{min-height:32px;padding:0 10px;font-size:12.5px;border-radius:8px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--panel2)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:12.5px;font-weight:600;color:var(--mu)}
.inp{width:100%;min-height:40px;padding:8px 12px;border-radius:10px;border:1px solid var(--ln);background:var(--panel);outline:none}
.inp:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--acs)}
textarea.inp{min-height:84px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:14px}
.hint{font-size:12px;color:var(--mu)}
.search{position:relative;flex:1;min-width:200px;max-width:360px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--mu)}
.search .inp{padding-left:36px}

/* Cards / panels */
.panel{background:var(--panel);border:1px solid var(--ln);border-radius:16px}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;border-bottom:1px solid var(--ln)}
.panel-h h2{font-size:15px;font-weight:650}
.panel-h .hint{margin:0}
.panel-b{padding:18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:14px}
.kpi{background:var(--panel);border:1px solid var(--ln);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi .l{font-size:12.5px;color:var(--mu);font-weight:500;display:flex;align-items:center;gap:8px}
.kpi .l i{width:8px;height:8px;border-radius:2px;background:var(--ac);display:inline-block}
.kpi .v{font-size:24px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:12px;color:var(--mu)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:18px}
.cols3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px;align-items:start}

/* Tables */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--ln)}
.toolbar select.inp{width:auto;min-width:150px}
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
.t th{text-align:left;font:500 11.5px var(--mono);color:var(--mu);text-transform:uppercase;letter-spacing:.06em;padding:11px 14px;border-bottom:1px solid var(--ln);white-space:nowrap;background:var(--panel)}
.t td{padding:12px 14px;border-bottom:1px solid var(--ln);vertical-align:middle;white-space:nowrap}
.t tbody tr{cursor:pointer}
.t tbody tr:hover td{background:var(--panel2)}
.t tr.static{cursor:default}
.t .r{text-align:right}
.t .wrap{white-space:normal;min-width:180px}
.t .sub{display:block;color:var(--mu);font-size:12px}
.id{font:500 12.5px var(--mono);color:var(--mu)}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;color:var(--mu);font-size:12.5px;flex-wrap:wrap}
.pager .pg{display:flex;gap:6px}
.empty{padding:40px 16px;text-align:center;color:var(--mu)}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px 3px 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--panel2);color:var(--mu);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ac{background:var(--acs);color:var(--ac)}
.pill.ok{background:var(--oks);color:var(--ok)}
.pill.warn{background:var(--warns);color:var(--warn)}
.pill.bad{background:var(--bads);color:var(--bad)}
.pill.vio{background:var(--vios);color:var(--vio)}
.prog{display:flex;align-items:center;gap:8px;min-width:140px}
.bar{flex:1;height:6px;border-radius:3px;background:var(--panel2);overflow:hidden;display:flex}
.bar i{display:block;height:100%;background:var(--ok)}
.bar i.part{background:var(--warn)}

/* 30-30-40 stage strip */
.stages{display:grid;grid-template-columns:3fr 3fr 4fr;gap:6px}
.stage{border:1px solid var(--ln);border-radius:12px;padding:12px;background:var(--panel);display:flex;flex-direction:column;gap:4px;min-width:0}
.stage .k{font:500 11px var(--mono);color:var(--mu);text-transform:uppercase;letter-spacing:.06em;display:flex;justify-content:space-between;gap:6px}
.stage .a{font-size:18px;font-weight:650;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stage .m{font-size:12px;color:var(--mu)}
.stage.paid{border-color:var(--ok);background:var(--oks)}
.stage.part{border-color:var(--warn);background:var(--warns)}
.stage.over{border-color:var(--bad)}
@media (max-width:560px){.stages{grid-template-columns:1fr}}

/* Charts */
.chart text{fill:var(--mu);font:11px var(--mono)}
.chart .gl{stroke:var(--ln)}
.chart .ln{stroke:var(--ac);fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--ac);opacity:.12}
.chart .pt{fill:var(--panel);stroke:var(--ac);stroke-width:2}
.hb{display:flex;flex-direction:column;gap:11px}
.hb .row{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:10px;align-items:center;font-size:13px}
.hb .row span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .trk{height:10px;border-radius:5px;background:var(--panel2);overflow:hidden}
.hb .trk i{display:block;height:100%;border-radius:5px;background:var(--ac)}
.hb .val{font:500 12px var(--mono);color:var(--mu);min-width:64px;text-align:right}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px;margin:6px 0 16px}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:12.5px;color:var(--mu)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.list{display:flex;flex-direction:column}
.list .it{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--ln)}
.list .it:last-child{border-bottom:0}
.list .it .grow{flex:1;min-width:0}
.list .it .grow b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .it .grow small{color:var(--mu)}

/* Modal */
.modal-wrap{position:fixed;inset:0;background:var(--overlay);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px 24px;overflow-y:auto}
.modal{background:var(--panel);border:1px solid var(--ln);border-radius:18px;width:100%;max-width:560px;box-shadow:var(--shadow);animation:pop .18s ease-out}
.modal.lg{max-width:900px}
.modal-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 20px;border-bottom:1px solid var(--ln)}
.modal-h h2{font-size:17px}
.modal-h p{margin:3px 0 0;color:var(--mu);font-size:13px}
.modal-b{padding:20px;display:flex;flex-direction:column;gap:16px}
.modal-f{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px;padding:14px 20px;border-top:1px solid var(--ln)}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:none}}
.dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:14px 20px}
.dl div{min-width:0}
.dl dt{font-size:12px;color:var(--mu);font-weight:500}
.dl dd{margin:2px 0 0;font-weight:600;overflow-wrap:anywhere}

.toast{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:80;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;font-weight:500;box-shadow:var(--shadow);max-width:calc(100vw - 40px);animation:pop .2s ease-out}

/* Slip generator layout */
.gen{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:1100px){.gen{grid-template-columns:1fr}}
.sheet-wrap{background:var(--panel2);border:1px solid var(--ln);border-radius:16px;padding:20px;overflow-x:auto}
.sheet-scale{width:794px;margin:0 auto;box-shadow:0 20px 50px -24px rgba(0,0,0,.35)}
.sheet-wrap.fit{overflow:hidden}

/* Printable document — deliberately fixed light palette */
.doc{--d-ink:#0D1424;--d-mu:#5A6576;--d-ln:#DDE3EB;--d-soft:#F3F6FA;--d-ac:#1F4FE0;--d-acs:#E8EEFF;--d-ok:#0F7A55;--d-warn:#9A5800;--d-bad:#C2352B;
  width:794px;min-height:1123px;background:#FFFFFF;color:var(--d-ink);font:12.5px/1.5 var(--sans);padding:56px 60px 48px;display:flex;flex-direction:column;gap:26px;position:relative}
.doc .hd{display:flex;justify-content:space-between;gap:24px;align-items:flex-start;padding-bottom:22px;border-bottom:2px solid var(--d-ink)}
.doc .co{display:flex;gap:14px;align-items:flex-start}
.doc .co img{width:48px;height:48px;object-fit:contain}
.doc .co b{display:block;font-size:17px;letter-spacing:.01em}
.doc .co span{display:block;color:var(--d-mu);font-size:11.5px}
.doc .ttl{text-align:right}
.doc .ttl h1{font-size:24px;letter-spacing:.12em;font-weight:700;margin:0}
.doc .ttl .no{font:600 13px var(--mono);color:var(--d-ac);margin-top:4px}
.doc .ttl .dt{color:var(--d-mu);font-size:11.5px}
.doc .two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.doc .box{border:1px solid var(--d-ln);border-radius:10px;padding:14px 16px}
.doc .lbl{font:600 10px var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--d-mu);margin-bottom:8px}
.doc .box b{display:block;font-size:14px}
.doc .box span{display:block;color:var(--d-mu)}
.doc .kv{display:grid;grid-template-columns:auto 1fr;gap:3px 14px}
.doc .kv span{color:var(--d-mu)}
.doc .kv strong{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.doc table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.doc th{font:600 10px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--d-mu);text-align:left;padding:9px 10px;border-bottom:1.5px solid var(--d-ink)}
.doc td{padding:10px;border-bottom:1px solid var(--d-ln)}
.doc .r{text-align:right;white-space:nowrap}
.doc tr.cur td{background:var(--d-acs);font-weight:600}
.doc tfoot td{font-weight:700;border-bottom:0;border-top:1.5px solid var(--d-ink)}
.doc .due{display:grid;grid-template-columns:repeat(4,1fr);border:1.5px solid var(--d-ink);border-radius:12px;overflow:hidden}
.doc .due div{padding:14px 16px;border-right:1px solid var(--d-ln)}
.doc .due div:last-child{border-right:0;background:var(--d-ink);color:#fff}
.doc .due div:last-child .lbl{color:#B9C3D4}
.doc .due strong{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.doc .note{background:var(--d-soft);border-radius:10px;padding:14px 16px;white-space:pre-line}
.doc .sig{display:grid;grid-template-columns:1fr 1fr;gap:60px;margin-top:auto;padding-top:36px}
.doc .sig div{border-top:1px solid var(--d-ink);padding-top:8px;color:var(--d-mu);font-size:11.5px}
.doc .ft{border-top:1px solid var(--d-ln);padding-top:12px;display:flex;justify-content:space-between;gap:16px;color:var(--d-mu);font-size:10.5px}
.doc .stamp{display:inline-block;margin-top:10px;transform:rotate(-6deg);border:3px solid currentColor;border-radius:10px;padding:3px 12px;font:700 15px var(--mono);letter-spacing:.14em;opacity:.8}
.doc .stamp.ok{color:var(--d-ok)}.doc .stamp.warn{color:var(--d-warn)}.doc .stamp.bad{color:var(--d-bad)}
.doc .scope{white-space:pre-line}

#print-root{display:none}
#pdf-stage{position:fixed;left:-10000px;top:0}
#pdf-stage .doc{min-height:1110px}
@media (max-width:600px){#top-pay span{display:none}#top-pay{padding:0 11px}}
@media print{
  @page{size:A4;margin:0}
  html,body{background:#fff!important;height:auto}
  .app,.modal-wrap,.toast,.scrim{display:none!important}
  #print-root{display:block}
  #print-root .doc{min-height:1090px;height:auto;page-break-after:always}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* Sign-in */
.auth{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 16px;background:var(--bg)}
.auth-card{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--ln);border-radius:20px;padding:32px;box-shadow:var(--shadow)}
.auth-form{display:flex;flex-direction:column;gap:14px}
.auth-card .brand{display:flex}

</style>
</head>
<body>
<div id="auth" class="auth" hidden></div>
<div class="app" id="app" hidden>
  <aside class="side" id="side" aria-label="Main navigation">
    <a class="brand" href="#dashboard" id="brand"></a>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="avatar" id="who-av" aria-hidden="true">SA</div>
      <div style="min-width:0;flex:1">
        <div style="font-weight:600;font-size:13px" id="who-name">Super Admin</div>
        <div class="hint" id="who-role"></div>
      </div>
      <button class="iconbtn" id="logout-btn" data-action="logout" aria-label="Sign out" title="Sign out"></button>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="main">
    <header class="top">

function sha256(str) {

  const buf = new Uint8Array(size); buf.set(msg); buf[l] = 0x80;
  const dv = new DataView(buf.buffer);
  dv.setUint32(size - 4, (l * 8) >>> 0); dv.setUint32(size - 8, Math.floor(l * 8 / 4294967296));
  const W = new Uint32Array(64);
  const r = (x, n) => (x >>> n) | (x << (32 - n));
  for (let i = 0; i < size; i += 64) {
    for (let t = 0; t < 16; t++) W[t] = dv.getUint32(i + t * 4);
    for (let t = 16; t < 64; t++) { const x = W[t - 15], y = W[t - 2]; W[t] = (W[t - 16] + (r(x, 7) ^ r(x, 18) ^ (x >>> 3)) + W[t - 7] + (r(y, 17) ^ r(y, 19) ^ (y >>> 10))) >>> 0; }

/* ───────────────────────── 30 / 30 / 40 engine ───────────────────────── */
/* Amounts are whole taka. Stage 1 and 2 are rounded; stage 3 takes the remainder so the three always add up to the project value exactly. */
function splitStages(total) {
  const t = Math.round(total || 0);
  const a = Math.round(t * 0.30), m = Math.round(t * 0.30);
  return [a, m, t - a - m];
}
/* Advance is due at start, midway halfway through, final on delivery. */
function stageDueDates(b) {
  const span = Math.max(0, diffDays(b.start, b.delivery));
  return [b.start, addDays(b.start, Math.round(span / 2)), b.delivery];
}
const paidFor = (bid, n) => sum(S.payments.filter(p => p.bookingId === bid && p.stage === n), p => p.amount);
function stagesOf(b) {
  const amts = splitStages(b.cost), dues = stageDueDates(b), t = today();
  return STAGES.map((st, i) => {
    const amount = amts[i];
    const paid = Math.min(paidFor(b.id, st.n), amount);
    const balance = Math.max(0, amount - paid);
    const status = amount > 0 && balance === 0 ? 'Paid' : paid > 0 ? 'Partial' : 'Pending';
    const overdue = balance > 0 && dues[i] < t && CONTRACTED.includes(b.status);
    return { ...st, amount, paid, balance, due: dues[i], status, overdue };
  });
}
function summaryOf(b) {
  const stages = stagesOf(b);
  const total = Math.round(b.cost || 0);
  const received = sum(stages, s => s.paid);
  const outstanding = Math.max(0, total - received);
  const next = stages.find(s => s.balance > 0) || null;
  const status = received === 0 ? 'Pending' : outstanding === 0 ? 'Paid' : 'Partial';
  return { stages, total, received, outstanding, next, status, pct: total ? received / total : 0, overdue: stages.filter(s => s.overdue) };
}

/* Generic table with search, filters and pagination */
const TS = {};
function tstate(key) { return TS[key] || (TS[key] = { q:'', f:{}, page:1 }); }
function table({ key, rows, cols, filters = [], open, empty = 'No records match.', extra = '', size = PAGE }) {
  const st = tstate(key);
  let list = rows;
  const q = st.q.trim().toLowerCase();
  if (q) list = list.filter(r => r._s.toLowerCase().includes(q));
  filters.forEach(f => { const v = st.f[f.k]; if (v) list = list.filter(r => f.test(r, v)); });
  const pages = Math.max(1, Math.ceil(list.length / size));
  st.page = Math.min(st.page, pages);
  const slice = list.slice((st.page - 1) * size, st.page * size);
  const from = list.length ? (st.page - 1) * size + 1 : 0, to = Math.min(st.page * size, list.length);
  return `<div class="toolbar">
      <div class="search">${ic('search', 16)}<input class="inp" id="ts-${key}" data-tsearch="${key}" type="search" placeholder="Search" value="${esc(st.q)}" aria-label="Search"></div>
      ${filters.map(f => `<select class="inp" id="tf-${key}-${f.k}" data-tfilter="${key}" data-fk="${f.k}" aria-label="${esc(f.label)}"><option value="">${esc(f.label)}: All</option>${f.options.map(o => `<option${st.f[f.k] === o ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select>`).join('')}
      ${extra}
    </div>
    <div class="tw"><table class="t"><thead><tr>${cols.map(c => `<th class="${c.cls || ''}">${c.h}</th>`).join('')}</tr></thead>
    <tbody>${slice.length ? slice.map(r => `<tr ${open ? open(r) : 'class="static"'}>${cols.map(c => `<td class="${c.cls || ''}">${c.v(r)}</td>`).join('')}</tr>`).join('') : `<tr class="static"><td colspan="${cols.length}"><div class="empty">${empty}</div></td></tr>`}</tbody></table></div>
    <div class="pager"><span class="num">${from}–${to} of ${list.length}</span>
      <div class="pg"><button class="btn sm" data-action="page" data-key="${key}" data-dir="-1" ${st.page <= 1 ? 'disabled' : ''} aria-label="Previous page">${ic('left', 15)}</button>
      <span class="btn sm ghost num" style="cursor:default">${st.page} / ${pages}</span>
      <button class="btn sm" data-action="page" data-key="${key}" data-dir="1" ${st.page >= pages ? 'disabled' : ''} aria-label="Next page">${ic('right', 15)}</button></div></div>`;
}

/* Charts */
function niceMax(v) { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= v) return m * p; return 10 * p; }
const axisFmt = v => v === 0 ? '0' : v >= 1e7 ? (v / 1e7).toFixed(v % 1e7 ? 1 : 0) + 'Cr' : v >= 1e5 ? (+(v / 1e5).toFixed(1)) + 'L' : (v / 1e3) + 'k';
function lineChart(points) {
  const W = 680, H = 240, L = 48, R = 14, T = 14, B = 28;
  const max = niceMax(Math.max(...points.map(p => p.v), 1));
  const x = i => L + i * (W - L - R) / (points.length - 1);
  const y = v => T + (H - T - B) * (1 - v / max);
  const ticks = [0, .25, .5, .75, 1].map(f => f * max);
  const path = points.map((p, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.v).toFixed(1)).join(' ');
  const area = path + ` L${x(points.length - 1)} ${y(0)} L${x(0)} ${y(0)} Z`;
  const last = points.length - 1;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Revenue received per month for the last 12 months">
    ${ticks.map(t => `<line class="gl" x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"></line><text x="${L - 8}" y="${y(t) + 4}" text-anchor="end">${axisFmt(t)}</text>`).join('')}
    <path class="ar" d="${area}"></path><path class="ln" d="${path}"></path>
    ${points.map((p, i) => `<circle class="pt" cx="${x(i)}" cy="${y(p.v)}" r="${i === last ? 5 : 3}"><title>${p.l}: ${money(p.v)}</title></circle><text x="${x(i)}" y="${H - 8}" text-anchor="middle">${p.l}</text>`).join('')}
  </svg>`;
}
function hbars(items, fmt = v => v) {
  const max = Math.max(...items.map(i => i.v), 1);
  return `<div class="hb">${items.map(i => `<div class="row"><span title="${esc(i.l)}">${esc(i.l)}</span><div class="trk"><i style="width:${Math.max(2, i.v / max * 100)}%"></i></div><span class="val num">${fmt(i.v)}</span></div>`).join('')}</div>`;
}
function last12() {
  const now = new Date(), out = [];
  for (let i = 11; i >= 0; i--) { const d = new Date(now.getFullYear(), now.getMonth() - i, 1); out.push({ key: d.getFullYear() + '-' + pad(d.getMonth() + 1), l: d.toLocaleDateString('en-GB', { month: 'short' }), long: d.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' }) }); }
  return out;
}

    filters:[{ k:'status', label:'Status', options:BOOKING_STATUSES, test:(r, v) => r.b.status === v }, { k:'service', label:'Service', options:SERVICES, test:(r, v) => r.b.service === v }],
    open: r => `data-action="open-booking" data-id="${r.b.id}"`,
    cols:[
      { h:'Booking', v:r => `<span class="id">${r.b.id}</span>` },
      { h:'Client / Project', cls:'wrap', v:r => `<b>${esc(r.c.company)}</b><span class="sub">${esc(r.b.project)}</span>` },
      { h:'Service', v:r => esc(r.b.service) },
      { h:'Value', cls:'r num', v:r => money(r.b.cost) },
      { h:'Start', v:r => fdate(r.b.start) },
      { h:'Delivery', v:r => fdate(r.b.delivery) },
      { h:'Status', v:r => statusPill(r.b.status) },
      { h:'Collected', v:r => CONTRACTED.includes(r.b.status) || r.sm.received ? progress(r.sm) : '<span class="hint">Not started</span>' },
    ] })}</section>`;
};

V.payments = () => {
  const con = contracted().map(b => ({ b, c: getC(b.clientId), sm: summaryOf(b) }));
  const tot = sum(con, x => x.sm.total), rec = sum(con, x => x.sm.received), out = sum(con, x => x.sm.outstanding);
  const od = sum(con, x => sum(x.sm.overdue, s => s.balance));
  const rows = con.map(x => ({ ...x, _s: [x.b.id, x.b.project, x.c.company, x.c.name].join(' ') }));
  const ledger = S.payments.slice().sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id)).map(p => { const b = getB(p.bookingId) || {}; const c = getC(b.clientId); return { p, b, c, _s: [p.id, p.ref, p.method, b.id, c.company].join(' ') }; });
  return `<div class="ph"><div><h1>Payments</h1><p>Collections tracked against the 30% advance, 30% midway and 40% final stages.</p></div>
    <div class="acts"><button class="btn p" data-action="new-payment">${ic('plus', 16)} Record payment</button></div></div>
  <div class="kpis">
    <div class="kpi"><div class="l"><i></i>Total amount</div><div class="v num">${money(tot)}</div><div class="s">${con.length} contracted projects</div></div>
    <div class="kpi"><div class="l"><i style="background:var(--ok)"></i>Amount received</div><div class="v num">${money(rec)}</div><div class="s">${tot ? Math.round(rec / tot * 100) : 0}% collected</div></div>
    <div class="kpi"><div class="l"><i style="background:var(--warn)"></i>Outstanding</div><div class="v num">${money(out)}</div><div class="s">Still to collect</div></div>
    <div class="kpi"><div class="l"><i style="background:var(--bad)"></i>Overdue</div><div class="v num">${money(od)}</div><div class="s">Past the stage due date</div></div>
  </div>
  <section class="panel"><div class="panel-h"><h2>Payment tracking</h2><span class="hint">Select a project to see its stages</span></div>
  ${table({ key:'paytrack', rows,
    filters:[{ k:'status', label:'Payment', options:['Pending','Partial','Paid'], test:(r, v) => r.sm.status === v }, { k:'od', label:'Due', options:['Overdue only'], test:r => r.sm.overdue.length > 0 }],
    open: r => `data-action="open-booking" data-id="${r.b.id}"`,
    cols:[
      { h:'Booking', cls:'wrap', v:r => `<b>${esc(r.c.company)}</b><span class="sub">${r.b.id} · ${esc(r.b.project)}</span>` },
      { h:'Total', cls:'r num', v:r => money(r.sm.total) },
      { h:'Received', cls:'r num', v:r => money(r.sm.received) },
      { h:'Outstanding', cls:'r num', v:r => money(r.sm.outstanding) },
      { h:'Progress', v:r => progress(r.sm) },
      { h:'Next due', v:r => r.sm.next ? `<span class="num">${money(r.sm.next.balance)}</span><span class="sub">Stage ${r.sm.next.n} · ${r.sm.next.label} · ${fdate(r.sm.next.due)}</span>` : '<span class="hint">Fully paid</span>' },
      { h:'Status', v:r => r.sm.overdue.length ? pill('Overdue', 'bad') : payPill(r.sm.status) },
    ] })}</section>
  <section class="panel"><div class="panel-h"><h2>Payments received</h2><span class="hint">${S.payments.length} receipts</span></div>
  ${table({ key:'ledger', rows:ledger,
    filters:[{ k:'m', label:'Method', options:METHODS, test:(r, v) => r.p.method === v }],
    open: r => `data-action="slip-for" data-id="${r.p.bookingId}" data-stage="${r.p.stage}" title="Open the payment slip for this stage"`,
    cols:[
      { h:'Receipt', v:r => `<span class="id">${r.p.id}</span>` },
      { h:'Date', v:r => fdate(r.p.date) },
      { h:'Client / Booking', cls:'wrap', v:r => `<b>${esc(r.c.company)}</b><span class="sub">${r.b.id || ''}</span>` },
      { h:'Stage', v:r => `${r.p.stage} · ${STAGES[r.p.stage - 1].label}` },
      { h:'Method', v:r => esc(r.p.method) },
      { h:'Reference', v:r => `<span class="mono hint">${esc(r.p.ref || '—')}</span>` },
      { h:'Amount', cls:'r num', v:r => `<b>${money(r.p.amount)}</b>` },
    ] })}</section>`;
};

/* Slip generator state */
const G = { bookingId:'', stage:0, issue:'', due:'', note:'', loaded:null };
V.slips = () => {
  const pool = S.bookings.filter(b => b.status !== 'Cancelled');
  if (!G.bookingId || !getB(G.bookingId)) { const f = contracted().find(b => summaryOf(b).outstanding > 0) || pool[0]; G.bookingId = f ? f.id : ''; }
  const b = getB(G.bookingId);
  if (!b) return `<div class="ph"><div><h1>Payment Slips</h1><p>Add a booking first.</p></div></div>`;
  const sm = summaryOf(b);
  if (!G.stage) G.stage = sm.next ? sm.next.n : 1;
  if (!G.issue) G.issue = today();
  const st = sm.stages[G.stage - 1];
  const snap = G.loaded || slipSnapshot(b.id, G.stage, G.issue, G.due || null, G.note);
  const issued = !!G.loaded;
  const rows = S.slips.map(s => ({ s, _s: [s.no, s.bookingId, s.client.company, s.client.name, s.project].join(' ') }));
  return `<div class="ph"><div><h1>Payment Slips</h1><p>Pick a booking and stage. Amounts come straight from the 30 / 30 / 40 schedule and the payments recorded so far.</p></div>
    <div class="acts">${issued ? `<button class="btn" data-action="slip-new">${ic('plus', 16)} New slip</button>` : ''}</div></div>
  <div class="gen">
    <section class="panel">
      <div class="panel-h"><h2>${issued ? 'Issued slip ' + esc(snap.no) : 'Generate slip'}</h2>${issued ? pill('Issued', 'ok') : pill('Draft', '')}</div>
      <form class="panel-b" style="display:flex;flex-direction:column;gap:14px" data-form="slip-noop">
        ${issued ? `<div class="dl"><div><dt>Booking</dt><dd>${esc(snap.bookingId)}</dd></div><div><dt>Stage</dt><dd>${snap.stage} · ${esc(snap.stageLabel)}</dd></div><div><dt>Issued</dt><dd>${fdate(snap.issued)}</dd></div></div>
          <p class="hint" style="margin:0">Issued slips keep the figures from the day they were issued. Start a new slip to reflect later payments.</p>` : `
        ${field('Booking', `<select class="inp" id="sg-booking" data-live="slip-booking">${bookingOptions(pool, b.id)}</select>`, 'sg-booking')}
        ${field('Payment stage', `<select class="inp" id="sg-stage" data-live="slip-field">${sm.stages.map(s => `<option value="${s.n}"${s.n === G.stage ? ' selected' : ''}>Stage ${s.n} · ${s.label} (${s.pct}%) · ${s.status === 'Paid' ? 'paid' : money(s.balance) + ' due'}</option>`).join('')}</select>`, 'sg-stage')}
        <div class="grid2">
          ${field('Issue date', input('sg-issue', 'issue', G.issue, 'date', 'data-live="slip-field"'), 'sg-issue')}
          ${field('Due date', input('sg-due', 'due', G.due || st.due, 'date', 'data-live="slip-field"'), 'sg-due', 'Defaults to the stage due date')}
        </div>
        ${field('Note on slip (optional)', area('sg-note', 'note', G.note, 'data-live="slip-field" rows="3" placeholder="e.g. Midway milestone: admin panel delivered"'), 'sg-note')}`}
        <div style="border:1px solid var(--ln);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px">
          <div style="display:flex;justify-content:space-between"><span class="hint">Stage amount (${snap.pct}% of ${money(snap.cost)})</span><b class="num">${money(snap.amountDue)}</b></div>
          <div style="display:flex;justify-content:space-between"><span class="hint">Already paid</span><b class="num" style="color:var(--ok)">${money(snap.amountPaid)}</b></div>
          <div style="display:flex;justify-content:space-between;border-top:1px solid var(--ln);padding-top:8px"><span style="font-weight:600">Balance payable</span><b class="num" style="font-size:17px">${money(snap.balance)}</b></div>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:8px">
          ${issued ? '' : `<button type="button" class="btn p" data-action="slip-issue">${ic('check', 16)} Issue slip</button>`}
          <button type="button" class="btn" data-action="slip-print">${ic('print', 16)} Print</button>
          <button type="button" class="btn" data-action="slip-pdf">${ic('download', 16)} Download PDF</button>
          <button type="button" class="btn" data-action="slip-email">${ic('mail', 16)} Email client</button>
        </div>
        ${issued ? '' : '<p class="hint" style="margin:0">Print, PDF and email issue the slip first, so every slip that leaves the office has a number on record.</p>'}
      </form>
    </section>
    <section class="sheet-wrap" aria-label="Slip preview"><div class="sheet-scale" id="slip-preview">${slipDoc(snap, !issued)}</div></section>
  </div>
  <section class="panel"><div class="panel-h"><h2>Issued slips</h2><span class="hint">${S.slips.length} on record</span></div>
  ${table({ key:'slips', rows, size:6,
    open: r => `data-action="slip-load" data-no="${r.s.no}"`,
    cols:[
      { h:'Slip no.', v:r => `<span class="id">${r.s.no}</span>` },
      { h:'Issued', v:r => fdate(r.s.issued) },
      { h:'Client / Booking', cls:'wrap', v:r => `<b>${esc(r.s.client.company)}</b><span class="sub">${r.s.bookingId} · ${esc(r.s.project)}</span>` },
      { h:'Stage', v:r => `${r.s.stage} · ${esc(r.s.stageLabel)} (${r.s.pct}%)` },
      { h:'Amount due', cls:'r num', v:r => money(r.s.amountDue) },
      { h:'Paid', cls:'r num', v:r => money(r.s.amountPaid) },
      { h:'Balance', cls:'r num', v:r => `<b>${money(r.s.balance)}</b>` },
      { h:'Due date', v:r => fdate(r.s.due) },
    ] })}</section>`;
};

V.quotations = () => {
  const rows = S.quotations.slice().sort((a, b) => b.id.localeCompare(a.id)).map(q => { const c = getC(q.clientId); return { q, c, t: calcQuote(q), _s: [q.id, q.project, c.company, c.name, q.status].join(' ') }; });
  return `<div class="ph"><div><h1>Quotations</h1><p>Build a quotation, send it, and turn an accepted one into a booking with its payment schedule.</p></div>
    <div class="acts"><button class="btn p" data-action="new-quote">${ic('plus', 16)} New quotation</button></div></div>
  <section class="panel">${table({ key:'quotes', rows,
    filters:[{ k:'s', label:'Status', options:Q_STATUSES, test:(r, v) => r.q.status === v }],
    open: r => `data-action="open-quote" data-id="${r.q.id}"`,
    cols:[
      { h:'Quotation', v:r => `<span class="id">${r.q.id}</span>` },
      { h:'Client / Project', cls:'wrap', v:r => `<b>${esc(r.c.company)}</b><span class="sub">${esc(r.q.project)}</span>` },
      { h:'Service', v:r => esc(r.q.service) },
      { h:'Total', cls:'r num', v:r => `<b>${money(r.t.total)}</b>` },
      { h:'Issued', v:r => fdate(r.q.date) },
      { h:'Valid until', v:r => fdate(addDays(r.q.date, r.q.validDays || 30)) },
      { h:'Status', v:r => pill(r.q.status, Q_TONE[r.q.status]) },
    ] })}</section>`;
};

V.clients = () => {
  const rows = S.clients.map(c => { const bs = S.bookings.filter(b => b.clientId === c.id); const con = bs.filter(b => CONTRACTED.includes(b.status)).map(summaryOf); return { c, n: bs.length, billed: sum(con, s => s.total), out: sum(con, s => s.outstanding), _s: [c.id, c.name, c.company, c.email, c.phone].join(' ') }; });
  return `<div class="ph"><div><h1>Clients</h1><p>Profiles with projects, quotations, payments and communication history.</p></div>
    <div class="acts"><button class="btn p" data-action="new-client">${ic('plus', 16)} New client</button></div></div>
  <section class="panel">${table({ key:'clients', rows,
    open: r => `data-action="open-client" data-id="${r.c.id}"`,
    cols:[
      { h:'Client ID', v:r => `<span class="id">${r.c.id}</span>` },
      { h:'Name / Company', cls:'wrap', v:r => `<b>${esc(r.c.name)}</b><span class="sub">${esc(r.c.company)}</span>` },
      { h:'Email', v:r => esc(r.c.email) },
      { h:'Phone', v:r => `<span class="num">${esc(r.c.phone)}</span>` },
      { h:'Projects', cls:'r num', v:r => r.n },
      { h:'Billed', cls:'r num', v:r => money(r.billed) },
      { h:'Outstanding', cls:'r num', v:r => r.out ? `<b>${money(r.out)}</b>` : '<span class="hint">—</span>' },
    ] })}</section>`;
};

V.inquiries = () => {
  const rows = S.inquiries.slice().sort((a, b) => b.date.localeCompare(a.date)).map(i => ({ i, _s: [i.id, i.name, i.company, i.email, i.service, i.description].join(' ') }));
  return `<div class="ph"><div><h1>Inquiries</h1><p>Leads from the website form, referrals and calls.</p></div>
    <div class="acts"><button class="btn p" data-action="new-inquiry">${ic('plus', 16)} Add inquiry</button></div></div>
  <section class="panel">${table({ key:'inq', rows,
    filters:[{ k:'s', label:'Status', options:INQ_STATUSES, test:(r, v) => r.i.status === v }, { k:'src', label:'Source', options:SOURCES, test:(r, v) => r.i.source === v }],
    open: r => `data-action="open-inquiry" data-id="${r.i.id}"`,
    cols:[
      { h:'Inquiry', v:r => `<span class="id">${r.i.id}</span>` },
      { h:'Name / Company', cls:'wrap', v:r => `<b>${esc(r.i.name)}</b><span class="sub">${esc(r.i.company)}</span>` },
      { h:'Request', cls:'wrap', v:r => `${esc(r.i.service)}<span class="sub">${esc(r.i.type || 'Project inquiry')}</span>` },
      { h:'Budget', v:r => esc(r.i.budget || '—') },
      { h:'Source', v:r => esc(r.i.source) },

V.reports = () => {
  const months = last12().map(m => { const ps = S.payments.filter(p => p.date.slice(0, 7) === m.key); return { ...m, n: ps.length, v: sum(ps, p => p.amount) }; });
  const con = contracted().map(b => ({ b, c: getC(b.clientId), sm: summaryOf(b) }));
  const statusCounts = BOOKING_STATUSES.map(s => ({ l: s, v: S.bookings.filter(b => b.status === s).length }));
  const qStats = Q_STATUSES.map(s => { const qs = S.quotations.filter(q => q.status === s); return { s, n: qs.length, v: sum(qs, q => calcQuote(q).total) }; });
  const decided = S.quotations.filter(q => q.status === 'Accepted' || q.status === 'Rejected');
  const winRate = decided.length ? Math.round(S.quotations.filter(q => q.status === 'Accepted').length / decided.length * 100) : 0;
  const outRows = con.filter(x => x.sm.outstanding > 0).sort((a, b) => b.sm.outstanding - a.sm.outstanding);
  const cliRows = S.clients.map(c => { const xs = con.filter(x => x.b.clientId === c.id); return { c, n: S.bookings.filter(b => b.clientId === c.id).length, total: sum(xs, x => x.sm.total), rec: sum(xs, x => x.sm.received), out: sum(xs, x => x.sm.outstanding) }; }).sort((a, b) => b.total - a.total);
  const btns = k => `<div style="display:flex;gap:6px"><button class="btn sm" data-action="report-csv" data-r="${k}">${ic('download', 14)} Excel (CSV)</button><button class="btn sm" data-action="report-pdf" data-r="${k}">${ic('print', 14)} PDF</button></div>`;
  return `<div class="ph"><div><h1>Reports</h1><p>Export any report to Excel (CSV) or print it as a PDF.</p></div></div>
  <div class="cols">
    <section class="panel"><div class="panel-h"><h2>Monthly revenue</h2>${btns('revenue')}</div>
      <div class="panel-b">${hbars(months.slice().reverse().map(m => ({ l: m.long, v: m.v })), v => axisFmt(v))}</div>
      <div class="panel-b" style="border-top:1px solid var(--ln);display:flex;justify-content:space-between"><span class="hint">12-month total</span><b class="num">${money(sum(months, m => m.v))}</b></div></section>
    <section class="panel"><div class="panel-h"><h2>Sales performance</h2>${btns('sales')}</div>
      <div class="tw"><table class="t"><thead><tr><th>Quotation status</th><th class="r">Count</th><th class="r">Value</th></tr></thead><tbody>${qStats.map(q => `<tr class="static"><td>${pill(q.s, Q_TONE[q.s])}</td><td class="r num">${q.n}</td><td class="r num">${money(q.v)}</td></tr>`).join('')}</tbody></table></div>
      <div class="panel-b" style="display:flex;justify-content:space-between"><span class="hint">Win rate on decided quotations</span><b class="num">${winRate}%</b></div></section>
  </div>
  <section class="panel"><div class="panel-h"><h2>Outstanding payments</h2>${btns('outstanding')}</div>
    <div class="tw"><table class="t"><thead><tr><th>Booking</th><th>Client</th><th class="r">Total</th><th class="r">Received</th><th class="r">Outstanding</th><th>Next due</th></tr></thead><tbody>
    ${outRows.map(x => `<tr data-action="open-booking" data-id="${x.b.id}"><td><span class="id">${x.b.id}</span></td><td>${esc(x.c.company)}</td><td class="r num">${money(x.sm.total)}</td><td class="r num">${money(x.sm.received)}</td><td class="r num"><b>${money(x.sm.outstanding)}</b></td><td>${x.sm.next ? `Stage ${x.sm.next.n} · ${fdate(x.sm.next.due)} ${x.sm.next.overdue ? pill('Overdue', 'bad') : ''}` : ''}</td></tr>`).join('') || '<tr class="static"><td colspan="6"><div class="empty">No outstanding payments.</div></td></tr>'}
    </tbody></table></div></section>
  <div class="cols">
    <section class="panel"><div class="panel-h"><h2>Client summary</h2>${btns('clients')}</div>
      <div class="tw"><table class="t"><thead><tr><th>Client</th><th class="r">Projects</th><th class="r">Billed</th><th class="r">Outstanding</th></tr></thead><tbody>
      ${cliRows.map(x => `<tr data-action="open-client" data-id="${x.c.id}"><td><b>${esc(x.c.company)}</b><span class="sub">${esc(x.c.name)}</span></td><td class="r num">${x.n}</td><td class="r num">${money(x.total)}</td><td class="r num">${x.out ? money(x.out) : '—'}</td></tr>`).join('')}
      </tbody></table></div></section>
    <section class="panel"><div class="panel-h"><h2>Project status</h2>${btns('status')}</div><div class="panel-b">${hbars(statusCounts)}</div></section>
  </div>`;
};

  <form class="panel" data-form="password" novalidate>

    <div class="panel-b" style="display:flex;flex-direction:column;gap:16px">

function calcQuote(q) {
  const subtotal = sum(q.items || [], i => Math.round((+i.qty || 0) * (+i.rate || 0)));
  const discount = Math.min(subtotal, Math.round(+q.discount || 0));
  const taxRate = +(q.taxRate ?? S.settings.taxRate) || 0;
  const tax = Math.round((subtotal - discount) * taxRate / 100);
  return { subtotal, discount, taxRate, tax, total: subtotal - discount + tax };
}

function printDoc(html) {

function savePDF(html, filename) {
  if (!window.html2pdf) { toast('PDF engine did not load. Use Print and choose "Save as PDF".'); return; }
  const stage = $('#pdf-stage'); stage.innerHTML = html;
  const el = stage.firstElementChild;
  toast('Preparing PDF…');
  window.html2pdf().set({ margin: 0, filename, image: { type: 'jpeg', quality: 0.96 }, html2canvas: { scale: 2, backgroundColor: '#ffffff', useCORS: true }, jsPDF: { unit: 'px', format: [794, 1123], hotfixes: ['px_scaling'] }, pagebreak: { mode: ['css', 'legacy'] } })
    .from(el).save().then(() => { stage.innerHTML = ''; toast('Saved ' + filename); }, () => { stage.innerHTML = ''; toast('Could not create the PDF. Use Print instead.'); });
}
function download(name, text, type) {
  try {
    const url = URL.createObjectURL(new Blob([text], { type }));
    const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
    toast('Downloaded ' + name);
  } catch (e) { toast('Download blocked by this browser.'); }
}

/* ───────────────────────── Actions ───────────────────────── */
function issueSlip() {
  if (G.loaded) return G.loaded;
  const snap = slipSnapshot(G.bookingId, G.stage, G.issue || today(), G.due || null, G.note);
  snap.no = nextId('PS', S.slips);
  S.slips.unshift(snap);
  logClient(snap.client.id, 'Slip', `Payment slip ${snap.no} issued for ${snap.bookingId}, stage ${snap.stage} (${money(snap.balance)} payable)`);
  save(); G.loaded = snap; render(); toast('Issued ' + snap.no);
  return snap;
}
function slipEmailText(d) {
  const s = S.settings;
  return {
    to: d.client.email,
    subject: `Payment slip ${d.no} · ${d.project} · Stage ${d.stage} ${d.stageLabel}`,
    body: `Dear ${d.client.name},\n\nPlease find payment slip ${d.no} for ${d.project} (${d.bookingId}).\n\nStage ${d.stage} of 3: ${d.stageLabel} (${d.pct}% of ${plainMoney(d.cost)})\nAmount due: ${plainMoney(d.amountDue)}\nAmount paid: ${plainMoney(d.amountPaid)}\nBalance payable: ${plainMoney(d.balance)}\nDue date: ${fdate(d.due)}\n\nHow to pay:\n${s.payInfo}\n\nThank you,\n${s.company}\n${s.phone} · ${s.email}`,
    hint: d.no,
  };
}
const A = {
  close: () => closeModal(),
  logout: () => { setSession(null); showAuth('login', ''); toast('Signed out'); },
  page: el => { const st = tstate(el.dataset.key); st.page = Math.max(1, st.page + +el.dataset.dir); render(); },
  'open-booking': el => bookingModal(el.dataset.id),

  'open-quote': el => quoteModal(el.dataset.id),
  'new-booking': el => bookingForm(null, { clientId: el.dataset.client }),
  'edit-booking': el => bookingForm(el.dataset.id),
  'new-client': () => clientForm(null),
  'edit-client': el => clientForm(el.dataset.id),
  'new-inquiry': () => inquiryForm(),
  'new-quote': el => quoteForm(null, el.dataset.client),

    if (el.dataset.armed !== '1') { el.dataset.armed = '1'; el.innerHTML = 'Delete?'; el.classList.remove('ghost'); return; }

  },
  'slip-for': el => { Object.assign(G, { bookingId: el.dataset.id, stage: +el.dataset.stage || 0, issue: today(), due: '', note: '', loaded: null }); closeModal(); if (route() === 'slips') render(); else location.hash = 'slips'; window.scrollTo({ top: 0 }); },
  'slip-new': () => { G.loaded = null; G.due = ''; G.note = ''; render(); },
  'slip-load': el => { const s = S.slips.find(x => x.no === el.dataset.no); if (s) { G.loaded = s; G.bookingId = s.bookingId; G.stage = s.stage; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); } },
  'slip-issue': () => issueSlip(),
  'slip-print': () => { const d = issueSlip(); printDoc(slipDoc(d)); },
  'slip-pdf': () => { const d = issueSlip(); savePDF(slipDoc(d), d.no + '.pdf'); },
  'slip-email': () => { const d = issueSlip(); emailModal(slipEmailText(d)); },
  'email-copy': () => {
    const t = `To: ${$('#em-to').value}\nSubject: ${$('#em-sub').value}\n\n${$('#em-body').value}`;
    const done = () => toast('Message copied');
    if (navigator.clipboard) navigator.clipboard.writeText(t).then(done, () => { $('#em-body').select(); toast('Select the message and copy it'); });
    else { $('#em-body').select(); toast('Select the message and copy it'); }
  },
  'quote-print': el => printDoc(quoteDoc(getQ(el.dataset.id))),
  'quote-pdf': el => savePDF(quoteDoc(getQ(el.dataset.id)), el.dataset.id + '.pdf'),
  'quote-email': el => {
    const q = getQ(el.dataset.id), c = getC(q.clientId), t = calcQuote(q), s = S.settings, sp = splitStages(t.total);
    emailModal({ to: c.email, hint: q.id, subject: `Quotation ${q.id} · ${q.project}`,
      body: `Dear ${c.name},\n\nThank you for considering ${s.company}. Please find our quotation ${q.id} for ${q.project}.\n\nTotal: ${plainMoney(t.total)}\nTimeline: ${q.timeline || 'as discussed'}\nPayment: 30% advance (${plainMoney(sp[0])}), 30% midway (${plainMoney(sp[1])}), 40% on delivery (${plainMoney(sp[2])})\nValid until: ${fdate(addDays(q.date, q.validDays || 30))}\n\nWe would be glad to walk you through it.\n\nBest regards,\n${s.company}\n${s.phone} · ${s.email}` });
  },
  'quote-status': el => {
    const q = getQ(el.dataset.id), s = el.dataset.s; q.status = s;
    logClient(q.clientId, 'Quotation', `${q.id} marked ${s.toLowerCase()}`);
    let msg = `${q.id} marked ${s.toLowerCase()}`;
    if (s === 'Sent' && q.bookingId) { const b = getB(q.bookingId); if (b && b.status === 'Inquiry') b.status = 'Quotation Sent'; }
    if (s === 'Accepted') {
      const total = calcQuote(q).total;
      let b = q.bookingId && getB(q.bookingId);
      if (b) { b.cost = total; if (!CONTRACTED.includes(b.status)) b.status = 'Approved'; }
      else {
        b = { id: nextId('BK', S.bookings), clientId: q.clientId, project: q.project, service: q.service, cost: total, start: today(), delivery: addDays(today(), 90), status: 'Approved', created: today(), notes: '' };
        S.bookings.push(b); q.bookingId = b.id; msg = `Accepted. Booking ${b.id} created with a 30 / 30 / 40 schedule`;
      }
    }
    save(); render(); quoteModal(q.id); toast(msg);
  },
  'qe-add': () => { syncQE(); QE.items.push({ d: '', qty: 1, rate: 0 }); $('#qe-items').innerHTML = qeItems(); $('#qe-totals').innerHTML = qeTotals(); $('#qi-d-' + (QE.items.length - 1)).focus(); },
  'qe-del': el => { syncQE(); QE.items.splice(+el.dataset.k, 1); $('#qe-items').innerHTML = qeItems(); $('#qe-totals').innerHTML = qeTotals(); },
  'inq-client': el => { const i = getI(el.dataset.id); clientForm(null, { ...i, inquiryId: i.id }); },
  'inq-booking': el => {
    const i = getI(el.dataset.id);
    let c = S.clients.find(x => x.email.toLowerCase() === i.email.toLowerCase());
    if (!c) { c = { id: nextId('CL', S.clients, false), name: i.name, company: i.company || i.name, email: i.email, phone: i.phone, address: '', notes: `From inquiry ${i.id}`, created: today(), log: [] }; S.clients.push(c); logClient(c.id, 'Note', `Client created from inquiry ${i.id}`); save(); }
    bookingForm(null, { clientId: c.id, project: `${i.service} for ${i.company || i.name}`, service: i.service, status: 'Inquiry', inquiryId: i.id });
  },
  'report-csv': el => { const [t, h, rows] = reportData(el.dataset.r); download(t.toLowerCase().replace(/\s+/g, '-') + '-' + today() + '.csv', '﻿' + [h, ...rows].map(r => r.map(csvCell).join(',')).join('\r\n'), 'text/csv;charset=utf-8'); },
  'report-pdf': el => { const [t, h, rows] = reportData(el.dataset.r); printDoc(reportDoc(t, h, rows.map(r => r.map(v => typeof v === 'number' && h.join('').includes('BDT') && v > 999 ? Math.round(v).toLocaleString('en-IN') : v)))); },
  backup: () => download('petra-crm-backup-' + today() + '.json', JSON.stringify(S, null, 2), 'application/json'),
  reset: el => {
    if (el.dataset.armed !== '1') { el.dataset.armed = '1'; el.textContent = 'Click again to erase all records'; return; }
    S = seed(); save(); Object.keys(TS).forEach(k => delete TS[k]); Object.assign(G, { bookingId: '', stage: 0, issue: '', due: '', note: '', loaded: null }); render(); toast('Demo data restored');
  },
  'logo-clear': () => { S.settings.logo = ''; save(); render(); toast('Using the PETRA mark'); },
};
function syncQE() {
  document.querySelectorAll('[data-qi]').forEach(inp => { const it = QE.items[+inp.dataset.qi]; if (it) it[inp.dataset.qf] = inp.dataset.qf === 'd' ? inp.value : +inp.value || 0; });
  const d = $('#qf-discount'), t = $('#qf-tax'); if (d) QE.discount = +d.value || 0; if (t) QE.taxRate = +t.value || 0;
}

/* Forms */
const F = {
  login: f => {
    const d = Object.fromEntries(new FormData(f)); const err = $('#al-err');
    if (Date.now() < lockUntil) return err.textContent = `Too many attempts. Try again in ${Math.ceil((lockUntil - Date.now()) / 1000)} seconds.`;
    const u = getAuth().users.find(x => x.username.toLowerCase() === d.username.trim().toLowerCase());
    if (!u || hashPassword(d.password, u.salt) !== u.hash) {
      failCount++; if (failCount >= 5) { lockUntil = Date.now() + 30000; failCount = 0; }
      $('#al-pass').value = ''; $('#al-pass').focus();
      return err.textContent = 'That username and password do not match.';
    }
    failCount = 0;
    setSession({ u: u.username, exp: Date.now() + SESSION_HOURS * 3600e3 });
    enterApp();
  },
  'first-password': f => {
    const d = Object.fromEntries(new FormData(f)); const s = getSession(); if (!s) return showAuth('login');
    const problem = passwordProblem(d.pw, d.confirm, s.u); if (problem) return $('#ap-err').textContent = problem;
    const a = getAuth(), u = a.users.find(x => x.username === s.u);
    u.salt = randomSalt(); u.hash = hashPassword(d.pw, u.salt); u.mustChange = false; u.changed = today();
    setAuth(a); enterApp(); toast('Password saved');
  },
  password: f => {
    const d = Object.fromEntries(new FormData(f)); const err = $('#pw-err'); const s = getSession();
    const a = getAuth(), u = a.users.find(x => x.username === s.u);
    if (hashPassword(d.current, u.salt) !== u.hash) return err.textContent = 'Your current password is not correct.';
    const problem = passwordProblem(d.pw, d.confirm, s.u); if (problem) return err.textContent = problem;
    u.salt = randomSalt(); u.hash = hashPassword(d.pw, u.salt); u.changed = today();
    setAuth(a); f.reset(); err.textContent = ''; toast('Password changed');
  },
  'slip-noop': () => {},
  booking: f => {
    const d = Object.fromEntries(new FormData(f)); const err = $('#bf-err');
    const cost = Math.round(+d.cost);
    if (!d.project.trim()) return err.textContent = 'Enter a project name.';
    if (!(cost > 0)) return err.textContent = 'Enter an estimated cost above zero.';
    if (!d.start || !d.delivery) return err.textContent = 'Choose a start and delivery date.';
    if (d.delivery < d.start) return err.textContent = 'The delivery date must be on or after the start date.';
    if (d.id) {
      const b = getB(d.id), amts = splitStages(cost);
      const clash = STAGES.find((s, i) => paidFor(b.id, s.n) > amts[i]);
      if (clash) return err.textContent = `Stage ${clash.n} already has ${money(paidFor(b.id, clash.n))} paid, more than its new ${clash.pct}% share. Raise the cost or delete that payment first.`;
      Object.assign(b, { clientId: d.clientId, project: d.project.trim(), service: d.service, cost, start: d.start, delivery: d.delivery, status: d.status });
      save(); render(); bookingModal(b.id); toast('Booking updated');
    } else {
      const b = { id: nextId('BK', S.bookings), clientId: d.clientId, project: d.project.trim(), service: d.service, cost, start: d.start, delivery: d.delivery, status: d.status, created: today(), notes: '' };
      S.bookings.push(b);
      logClient(b.clientId, 'Note', `Booking ${b.id} created: ${b.project} (${money(cost)})`);
      if (d.inquiryId) { const i = getI(d.inquiryId); if (i) i.status = 'Converted'; }
      save(); render(); bookingModal(b.id); toast(`Booking ${b.id} created`);
    }
  },
  payment: f => {
    const d = Object.fromEntries(new FormData(f)); const err = $('#pf-err');
    const b = getB(d.bookingId), stage = +d.stage, amount = Math.round(+d.amount);
    const st = summaryOf(b).stages[stage - 1];
    if (!(amount > 0)) return err.textContent = 'Enter an amount above zero.';
    if (amount > st.balance) return err.textContent = `Stage ${stage} only has ${money(st.balance)} left. Record the rest against the next stage.`;
    if (!d.date) return err.textContent = 'Choose the payment date.';
    const p = { id: nextId('PAY', S.payments, false), bookingId: b.id, stage, amount, date: d.date, method: d.method, ref: d.ref.trim(), note: '' };
    S.payments.push(p);
    logClient(b.clientId, 'Payment', `${money(amount)} received for ${b.id}, stage ${stage} (${p.method})`, p.date);
    save(); render();
    if (d.back) bookingModal(d.back); else closeModal();
    toast(`Saved ${p.id}: ${money(amount)} to stage ${stage}`);
  },
  client: f => {
    const d = Object.fromEntries(new FormData(f)); const err = $('#cf-err');
    if (!d.name.trim() || !d.company.trim()) return err.textContent = 'Enter the name and company.';
    if (!/^\S+@\S+\.\S+$/.test(d.email)) return err.textContent = 'Enter a valid email address.';
    if (!d.phone.trim()) return err.textContent = 'Enter a phone number.';
    const data = { name: d.name.trim(), company: d.company.trim(), email: d.email.trim(), phone: d.phone.trim(), address: d.address.trim(), notes: d.notes.trim() };
    let id = d.id;
    if (id) Object.assign(getC(id), data);
    else { id = nextId('CL', S.clients, false); S.clients.push({ id, ...data, created: today(), log: [{ date: today(), type: 'Note', text: d.inquiryId ? `Client created from inquiry ${d.inquiryId}` : 'Client created' }] }); }
    save(); render(); clientModal(id); toast(d.id ? 'Client updated' : `Client ${id} created`);
  },
  'client-note': f => {
    const d = Object.fromEntries(new FormData(f)); if (!d.text.trim()) return;
    logClient(d.id, d.type, d.text.trim()); save(); clientModal(d.id);
  },
  inquiry: f => {
    const fd = new FormData(f), d = Object.fromEntries(fd); const err = $('#if-err');
    if (!d.name.trim()) return err.textContent = 'Enter the full name.';
    if (!/^\S+@\S+\.\S+$/.test(d.email)) return err.textContent = 'Enter a valid email address.';
    if (!d.phone.trim()) return err.textContent = 'Enter a phone number.';
    if (!d.description.trim()) return err.textContent = 'Describe the project.';
    const file = fd.get('attachment');
    const i = { id: nextId('INQ', S.inquiries), name: d.name.trim(), company: d.company.trim(), email: d.email.trim(), phone: d.phone.trim(), service: d.service, budget: d.budget.trim(), timeline: d.timeline.trim(), source: d.source, status: 'New', date: today(), description: d.description.trim(), attachment: file && file.name ? file.name : '', notes: d.notes.trim() };
    S.inquiries.push(i); save(); render(); inquiryModal(i.id); toast(`Inquiry ${i.id} saved`);
  },
  quote: f => {
    syncQE(); const d = Object.fromEntries(new FormData(f)); const err = $('#qf-err');
    if (!d.project.trim()) return err.textContent = 'Enter a project name.';
    const items = QE.items.filter(i => i.d.trim() && i.qty > 0);
    if (!items.length) return err.textContent = 'Add at least one cost line with a description and quantity.';
    Object.assign(QE, { clientId: d.clientId, project: d.project.trim(), service: d.service, timeline: d.timeline.trim(), date: d.date || today(), validDays: +d.validDays || 30, scope: d.scope.trim(), terms: d.terms.trim(), items });
    if (QE.id) { Object.assign(getQ(QE.id), QE); }
    else { QE.id = nextId('QT', S.quotations); S.quotations.push(QE); logClient(QE.clientId, 'Quotation', `${QE.id} created for ${QE.project}`); }
    const id = QE.id; QE = null; save(); render(); quoteModal(id); toast(`Saved ${id}`);
  },
  settings: f => {
    const d = Object.fromEntries(new FormData(f));
    if (!d.company.trim()) return toast('Enter the company name.');
    Object.assign(S.settings, { company: d.company.trim(), tagline: d.tagline.trim(), email: d.email.trim(), phone: d.phone.trim(), website: d.website.trim(), address: d.address.trim(), taxLabel: d.taxLabel.trim() || 'VAT', taxRate: Math.max(0, +d.taxRate || 0), payInfo: d.payInfo, terms: d.terms });
    save(); render(); toast('Settings saved');
  },
};

/* Live inputs */
const L = {
  bf: () => { $('#bf-preview').innerHTML = schedulePreview($('#bf-cost').value, $('#bf-start').value, $('#bf-delivery').value); },
  pf: el => { const bid = $('#pf-booking').value; const stage = el.id === 'pf-stage' ? +el.value : 0; paymentModal(bid, stage, (CUR && CUR.back) || ''); },
  'slip-booking': el => { Object.assign(G, { bookingId: el.value, stage: 0, due: '', loaded: null }); render(); },
  'slip-field': () => {
    const stage = +$('#sg-stage').value;
    if (stage !== G.stage) { G.stage = stage; G.due = ''; render(); return; }
    G.issue = $('#sg-issue').value || today(); G.due = $('#sg-due').value; G.note = $('#sg-note').value;
    $('#slip-preview').innerHTML = slipDoc(slipSnapshot(G.bookingId, G.stage, G.issue, G.due || null, G.note), true);
  },
  'booking-status': el => {
    const b = getB(el.dataset.id); const old = b.status; b.status = el.value;
    logClient(b.clientId, 'Note', `${b.id} status changed from ${old} to ${b.status}`);
    save(); render(); bookingModal(b.id); toast(`${b.id} is now ${b.status}`);
  },
  'inq-status': el => { const i = getI(el.dataset.id); i.status = el.value; save(); render(); inquiryModal(i.id); toast(`${i.id} marked ${i.status.toLowerCase()}`); },
  'qe-totals': () => { syncQE(); $('#qe-totals').innerHTML = qeTotals(); },
  email: () => updateMailto(),
  logo: el => {
    const file = el.files && el.files[0]; if (!file) return;
    if (file.size > 300 * 1024) { toast('That logo is over 300 KB. Use a smaller file.'); return; }
    const r = new FileReader(); r.onload = () => { S.settings.logo = r.result; save(); render(); toast('Logo updated'); }; r.readAsDataURL(file);
  },
  restore: el => {
    const file = el.files && el.files[0]; if (!file) return;
    const r = new FileReader();
    r.onload = () => { try { const d = JSON.parse(r.result); if (!d.bookings || !d.clients || !d.payments) throw 0; S = d; save(); render(); toast('Backup restored'); } catch (e) { toast('That file is not a PETRA CRM backup.'); } };
    r.readAsText(file);
  },
};

/* ───────────────────────── Render & events ───────────────────────── */
function renderShell() {
  $('#brand').innerHTML = `${logoMark(30)}<div><b>PETRA</b><small>CRM &amp; Bookings</small></div>`;
  $('#menu-btn').innerHTML = ic('menu');
  $('#top-pay').innerHTML = `${ic('plus', 16)}<span>Record payment</span>`;
}
function renderNav(r) {
  const newInq = S.inquiries.filter(i => i.status === 'New').length;
  $('#nav').innerHTML = NAV.map(([g, items]) => `<div class="navgroup">${g}</div>` + items.map(([k, t, i]) => `<a href="#${k}" class="${k === r ? 'on' : ''}" ${k === r ? 'aria-current="page"' : ''}>${ic(i)}<span>${t}</span>${k === 'inquiries' && newInq ? `<span class="cnt">${newInq}</span>` : ''}</a>`).join('')).join('')
    + `<div class="navgroup">Public</div><a href="index.html">${ic('globe')}<span>View website</span></a>`;
  $('#crumb').innerHTML = `<span>PETRA CRM /</span> ${TITLES[r]}`;
}
function render() {
  if (!getSession()) { showAuth('login', 'Your session ended. Sign in again.'); return; }
  const r = route();
  const ae = document.activeElement; let focusId = ae && ae.id && $('#view').contains(ae) ? ae.id : null; let sel = null;
  try { if (focusId && typeof ae.selectionStart === 'number') sel = [ae.selectionStart, ae.selectionEnd]; } catch (e) {}
  renderNav(r);
  $('#view').innerHTML = V[r]();
  document.title = TITLES[r] + ' · PETRA CRM';
  if (focusId) { const n = document.getElementById(focusId); if (n) { n.focus({ preventScroll: true }); try { if (sel) n.setSelectionRange(sel[0], sel[1]); } catch (e) {} } }
}
function fitSheets() {
  document.querySelectorAll('.sheet-wrap').forEach(w => {
    const s = w.querySelector('.sheet-scale'); if (!s) return;
    const z = Math.min(1, (w.clientWidth - 40) / 794);
    s.style.zoom = z > 0.3 ? z : 0.3; w.classList.toggle('fit', z >= 0.3);
  });
}
window.addEventListener('resize', fitSheets);
new MutationObserver(() => fitSheets()).observe(document.body, { childList: true, subtree: true });
function setTheme(t) {
  if (t) document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme');
  const dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  $('#theme-btn').innerHTML = ic(dark ? 'sun' : 'moon');
  $('#theme-btn').setAttribute('aria-label', dark ? 'Switch to light theme' : 'Switch to dark theme');
}

document.addEventListener('click', e => {
  if (e.target.matches('[data-modal-bg]')) { closeModal(); return; }
  const el = e.target.closest('[data-action]');
  if (!el) {
    if (e.target.closest('#nav a')) { $('#side').classList.remove('open'); $('#scrim').classList.remove('open'); }
    return;
  }
  const fn = A[el.dataset.action];
  if (fn) { e.preventDefault(); if (el.closest('.side')) { $('#side').classList.remove('open'); $('#scrim').classList.remove('open'); } fn(el, e); }
});
document.addEventListener('submit', e => { const h = F[e.target.dataset.form]; if (h) { e.preventDefault(); h(e.target); } });
const onInput = e => {
  const t = e.target;
  if (t.dataset.tsearch) { const st = tstate(t.dataset.tsearch); st.q = t.value; st.page = 1; render(); return; }
  if (t.dataset.tfilter) { if (e.type !== 'change') return; const st = tstate(t.dataset.tfilter); st.f[t.dataset.fk] = t.value; st.page = 1; render(); return; }
  if (t.dataset.qi !== undefined && QE) { const it = QE.items[+t.dataset.qi]; if (it) { it[t.dataset.qf] = t.dataset.qf === 'd' ? t.value : +t.value || 0; } if (t.dataset.qf !== 'd') $('#qe-totals').innerHTML = qeTotals(); return; }
  const live = t.dataset.live; if (!live || !L[live]) return;
  const changeOnly = t.tagName === 'SELECT' || t.type === 'file' || t.type === 'date';
  if (changeOnly && e.type !== 'change') return;
  if (!changeOnly && e.type !== 'input') return;
  L[live](t);
};
document.addEventListener('input', onInput);
document.addEventListener('change', onInput);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#modal-root').innerHTML) closeModal(); });
window.addEventListener('hashchange', () => { closeModal(); render(); window.scrollTo({ top: 0 }); });
$('#menu-btn').addEventListener('click', () => { $('#side').classList.add('open'); $('#scrim').classList.add('open'); });
$('#scrim').addEventListener('click', () => { $('#side').classList.remove('open'); $('#scrim').classList.remove('open'); });
$('#theme-btn').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark'; setTheme(next); try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
});

/* Boot */
let savedTheme = null; try { savedTheme = localStorage.getItem(THEME_KEY); } catch (e) {}
renderShell(); setTheme(savedTheme);
$('#logout-btn').innerHTML = ic('logout', 17);
window.addEventListener('storage', e => { if (e.key === INBOX_KEY && booted && getSession()) { const n = importInbox(); if (n) { render(); toast(`${n} new website inquir${n === 1 ? 'y' : 'ies'} added`); } } });
enterApp();

})();

</script>
</body>
